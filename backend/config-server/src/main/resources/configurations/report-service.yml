# ========================
# Report Service — Shared Configuration (served by Config Server)
# ========================
# This file is picked up by Config Server and served to report-service
# via http://config-server:8888/report-service/default

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/report_forge_auth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  elasticsearch:
    uris: http://localhost:9200
  kafka:
    bootstrap-servers: localhost:9092

# ========================
# External Report DataSources (add/remove without code changes)
# ========================
report:
  datasources:
    sources:
      analytics-db:
        url: jdbc:postgresql://localhost:5432/analytics
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
        max-pool-size: 5
