spring.application.name=api-gateway
server.port=8080

# ========================
# Spring Cloud Gateway Routes
# ========================

# Auth Service Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=2

# Dashboard Service Routes
spring.cloud.gateway.routes[1].id=dashboard-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/dashboards/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=2

# Report Service Routes
spring.cloud.gateway.routes[2].id=report-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/reports/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=2

# Form Service Routes
spring.cloud.gateway.routes[3].id=form-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/forms/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=2

# Data Source Service Routes
spring.cloud.gateway.routes[4].id=data-source-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/datasources/**
spring.cloud.gateway.routes[4].filters[0]=StripPrefix=2

# ========================
# Global CORS Configuration
# ========================
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:5173,http://localhost:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.corsConfigurations.[/**].maxAge=3600

# ========================
# Actuator Configuration
# ========================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.enabled=true

# ========================
# Redis (Rate Limiting)
# ========================
spring.redis.host=localhost
spring.redis.port=6379

# ========================
# Logging
# ========================
logging.level.org.springframework.cloud.gateway=DEBUG
